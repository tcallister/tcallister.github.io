<header class="site">
  <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="top" aria-label="Main">
    {% for item in site.data.navigation %}
      {% assign current = false %}
      {% if page.url contains item.url %}{% assign current = true %}{% endif %}
      <a href="{{ item.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
